apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-rec-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: image-recognition
  template:
    metadata:
      labels:
        app: image-recognition
    spec:
      containers:
      - name: recognition-api
        image: your-docker-hub/image-rec:latest
        resources:
          limits:
            cpu: "500m"
          requests:
            cpu: "200m"
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: image-rec-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: image-rec-deployment
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
